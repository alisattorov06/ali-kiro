name: Companion CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'companion/**'
      - '.github/workflows/companion-ci.yml'
  push:
    branches: [main, master]
    paths:
      - 'companion/**'
      - '.github/workflows/companion-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Rust / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: Formatting
        working-directory: companion
        run: cargo fmt --check
      - name: Tests
        working-directory: companion
        run: cargo test

  windows:
    name: Rust / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Compile
        working-directory: companion
        run: cargo check
